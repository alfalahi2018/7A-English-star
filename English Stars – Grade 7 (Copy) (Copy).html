.wrap{max-width:600px;margin:0 auto;padding-block:8px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line);position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:20}
.brand{font-weight:700;font-size:17px}
.brand b{color:var(--red)}
.starbox{font-weight:700;background:var(--goldbg);color:var(--goldink);border:2px solid var(--gold);border-radius:99px;padding:3px 11px;white-space:nowrap}
.starbox.pop{animation:pop .5s}

.cover{margin-top:10px;background:var(--card);border-radius:28px;border:4px solid var(--gold);box-shadow:0 6px 0 var(--line);padding:18px 14px;text-align:center}

.cover h1{font-size:36px;margin:10px 0 0;line-height:1.05;text-wrap:balance}
.cover h1 span{color:var(--red)}
.cover .sub{font-weight:700;font-size:18px;color:var(--soft);margin-top:4px}
.cover .subar{font-size:15px;color:var(--soft);margin-top:2px}

details summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:8px}

.uhead{margin-top:12px;display:flex;align-items:center;gap:10px}

.uhead .tt .ar{font-size:14px;color:var(--soft);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--card);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14.5px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.tabs button.on{background:var(--uc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.page{background:var(--card);border-radius:26px;padding:16px 14px 18px;box-shadow:0 6px 0 var(--line);min-height:300px;animation:in .3s}

.inst{color:var(--soft);font-size:15px;margin:0 0 12px}

.ghead{font-weight:700;font-size:18px;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.wcard .e{font-size:28px;flex:none;width:36px;text-align:center}
.wcard .t{min-width:0}
.wcard .w{font-weight:700;font-size:16.5px;line-height:1.2;display:block}
.wcard .m{font-size:14px;color:var(--soft);display:block;margin-top:2px}
.wcard.hl{outline:3px solid var(--gold)}

.flash{perspective:900px;margin:6px auto 12px;max-width:340px}
.fcard{position:relative;display:block;width:100%;aspect-ratio:4/3.2;max-width:100%;transform-style:preserve-3d;transition:transform .5s}

.face{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--uc);background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.12);padding:12px}

.fcount{font-weight:700;color:var(--soft)}

.gmenu{display:grid;gap:10px}

.rule h4{font-size:19px;margin:0 0 6px}

.ex{background:var(--card);border-radius:14px;padding:8px 12px;margin-top:8px;font-weight:700;font-size:16.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}

.gq{border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;background:var(--card2)}

.gap{display:inline-block;min-width:56px;border-bottom:3px solid var(--uc);text-align:center;color:var(--uc)}

.cert .ar{display:block;font-size:16px;margin:2px 0 4px}

.field{width:100%;font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink)}

@keyframes toast{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0}}

</style>

function say(t,cb){

}

function pickOthers(pool,target,n){return shuffle(pool.filter(w=>w[0]!==target[0]&&w[2]!==target[2]&&w[1]!==target[1])).slice(0,n)}
function startGame(type){
  const all=words(U());let base=all;
  if(type==='spell')base=all.filter(w=>/^[a-z]+$/.test(w[0])&&w[0].length<=10);
  const rounds=shuffle(base).slice(0,6).map(t=>({t,opts:shuffle([t,...pickOthers(all,t,2)])}));
  G={type,rounds,i:0,score:0,res:[]};drawRound();
}
function dots(n,i,res){return `<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${res[k]===true?'ok':res[k]===false?'no':k===i?'on':''}"></i>`).join('')}</div>`}
function drawRound(){
  if(G.i>=G.rounds.length)return endGame();
  const r=G.rounds[G.i],p=page();let h=dots(G.rounds.length,G.i,G.res);
  if(G.type==='listen'){
    h+=`<button class="speaker" data-a="sayt" data-t="${esc(r.t[0])}" aria-label="Listen again">🔊</button>
     <p class="inst" style="text-align:center">Listen. Which picture is it? <span class="ar">استمعي. ما الصورة الصحيحة؟</span></p>
     <div class="opts">${r.opts.map((o,k)=>`<button class="opt" data-a="ans" data-k="${k}" aria-label="${esc(o[0])}">${o[2]}</button>`).join('')}</div>`;
    p.innerHTML=h;say(r.t[0]);
  }else if(G.type==='mean'){
    h+=`<div class="gpic">${r.t[2]}</div><div class="gword">${r.t[0]} <button data-a="sayt" data-t="${esc(r.t[0])}" aria-label="Listen">🔊</button></div>
     <div class="opts col">${r.opts.map((o,k)=>`<button class="opt txt ar" data-a="ans" data-k="${k}">${o[1]}</button>`).join('')}</div>`;
    p.innerHTML=h;say(r.t[0]);
  }else{
    const w=r.t[0];r.pos=0;r.miss=0;r.tiles=shuffle(w.split('').map((c,k)=>({c,k})));
    h+=`<div class="gpic">${r.t[2]}</div><div class="gmean ar">${r.t[1]}</div>
     <div style="text-align:center"><button class="btn ghost" data-a="sayt" data-t="${esc(w)}">🔊 Listen</button></div>
     <div class="slots">${w.split('').map((c,k)=>`<span class="slot" id="s${k}"></span>`).join('')}</div>
     <div class="pool">${r.tiles.map((t,k)=>`<button class="ptile" id="t${k}" data-a="tile" data-k="${k}">${t.c}</button>`).join('')}</div>`;
    p.innerHTML=h;
  }
}
function answer(btn,k){
  const r=G.rounds[G.i];if(r.done)return;
  const ok=r.opts[k][0]===r.t[0];
  if(ok){r.done=true;btn.classList.add('good');if(G.res[G.i]===undefined)G.res[G.i]=true;if(G.res[G.i])G.score++,addStar();toast(praise());say(r.t[0]);setTimeout(()=>{G.i++;drawRound()},1300)}
  else{G.res[G.i]=false;btn.classList.add('no');shake(btn)}
}
function tile(btn,k){
  const r=G.rounds[G.i],t=r.tiles[k],w=r.t[0];if(r.done)return;
  if(t.c===w[r.pos]){btn.classList.add('used');const s=document.getElementById('s'+r.pos);s.textContent=t.c;s.classList.add('f');r.pos++;
    if(r.pos===w.length){r.done=true;const ok=r.miss<3;G.res[G.i]=ok;if(ok){G.score++;addStar()}toast(praise());say(w);setTimeout(()=>{G.i++;drawRound()},1400)}}
  else{r.miss++;shake(btn)}
}

  const u=U(),all=words(u);const pool=shuffle(all);
  const qs=[];
  pool.slice(0,4).forEach(t=>qs.push({type:'mean',t,opts:shuffle([t,...pickOthers(all,t,2)])}));
  pool.slice(4,7).forEach(t=>qs.push({type:'listen',t,opts:shuffle([t,...pickOthers(all,t,2)])}));
  shuffle(u.gq).slice(0,3).forEach(g=>qs.push({type:'gram',g}));
  C={qs:shuffle(qs),i:0,score:0,res:[]};
  page().innerHTML=`<div class="win"><div class="big">🏆</div><h3>${u.name} Challenge</h3>
   <p>10 questions. Get 8 or more to win your certificate!</p><p class="ar">10 أسئلة. أجيبي 8 أو أكثر لتحصلي على شهادة الوحدة!</p>
   <button class="btn" data-a="cstart">Start</button></div>`;
}
function drawC(){
  if(C.i>=C.qs.length)return endC();
  const q=C.qs[C.i];let h=dots(C.qs.length,C.i,C.res);
  if(q.type==='mean')h+=`<p class="inst" style="text-align:center">What does it mean? <span class="ar">ما معنى الكلمة؟</span></p>
    <div class="gpic">${q.t[2]}</div><div class="gword">${q.t[0]}</div>
    <div class="opts col">${q.opts.map((o,k)=>`<button class="opt txt ar" data-a="cans" data-k="${k}">${o[1]}</button>`).join('')}</div>`;
  else if(q.type==='listen')h+=`<button class="speaker" data-a="sayt" data-t="${esc(q.t[0])}" aria-label="Listen again">🔊</button>
    <p class="inst" style="text-align:center">Listen and choose. <span class="ar">استمعي واختاري.</span></p>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-a="cans" data-k="${k}" aria-label="${esc(o[0])}">${o[2]}</button>`).join('')}</div>`;
  else h+=`<p class="inst" style="text-align:center">Choose the right answer. <span class="ar">اختاري الإجابة الصحيحة.</span></p>
    <div class="gq"><p>${esc(q.g[0]).replace('___','<span class="gap">?</span>')}</p></div>
    <div class="opts col">${q.g[1].map((o,k)=>`<button class="opt txt" data-a="cans" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  page().innerHTML=h;
  if(q.type==='listen')say(q.t[0]);
}
function cans(btn,k){
  const q=C.qs[C.i];if(q.lock)return;q.lock=true;
  const ok=q.type==='gram'?k===q.g[2]:q.opts[k][0]===q.t[0];
  C.res[C.i]=ok;
  if(ok){C.score++;btn.classList.add('good');toast(praise())}
  else{btn.classList.add('no');shake(btn);
    const right=q.type==='gram'?q.g[2]:q.opts.findIndex(o=>o[0]===q.t[0]);
    page().querySelectorAll('[data-a="cans"]')[right].classList.add('good')}
  setTimeout(()=>{C.i++;drawC()},ok?1100:1800);
}
function endC(){
  const u=U(),s=C.score;
  if(s>=8){addStar(5);done[u.key]=true;save();confetti();
    const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    page().innerHTML=`<div class="win"><div class="big">🥇</div><h3>${s} / 10 — You did it!</h3><p class="ar">أحسنتِ! اكتبي اسمكِ لتظهر شهادتكِ.</p></div>
     <label for="certName" class="ar" style="display:block;margin-bottom:6px">اسم الطالبة / Your name</label>
     <input class="field" id="certName" value="${esc(sname)}" placeholder="e.g. Reem" autocomplete="off">
     <div class="cert"><div class="st">⭐⭐⭐</div><h3>Certificate of Achievement</h3><span class="ar">شهادة إنجاز</span>
      <div>This is to certify that</div><div class="nm" id="certOut">${esc(sname)||'&nbsp;'}</div>
      <div>has completed <b>${u.num}: ${u.name}</b><br>with a score of <b>${s} / 10</b>.</div>
      <span class="ar">أتمّت الطالبة تحدّي الوحدة بنجاح 🎉</span>
      <div style="font-size:14px;margin-top:6px">${d}</div>
      <div class="sig">T. Badria Alfalahi</div></div>
     <p class="inst" style="text-align:center;margin-top:10px">Take a screenshot and send it to your teacher! <span class="ar">التقطي صورة للشهادة وأرسليها للمعلمة 📸</span></p>
     <div class="row" style="justify-content:center"><button class="btn ghost" data-a="home">All units</button></div>`;
  }else{
    page().innerHTML=`<div class="win"><div class="big">💪</div><h3>${s} / 10</h3>
     <p>You need 8 to win the certificate. Practise and try again!</p><p class="ar">تحتاجين 8 للحصول على الشهادة. راجعي الكلمات وحاولي مرة أخرى!</p>
     <div class="row" style="justify-content:center"><button class="btn" data-a="tab" data-t="challenge">Try again</button><button class="btn ghost" data-a="tab" data-t="words">Review words</button></div></div>`;
  }
}

/* events */
let resetArm=false;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
  if(a==='home'){S.view='home';render();scrollTo(0,0)}
  else if(a==='open'){S={view:'unit',u:+d.u,tab:'words'};render();scrollTo(0,0)}
  else if(a==='tab'){S.tab=d.t;render()}
  else if(a==='sayw'){const w=words(U())[+d.i];say(w[0])}
  else if(a==='sayt')say(d.t);
  else if(a==='playall')playAll();
  else if(a==='flip'){const c=document.getElementById('fcard');c.classList.toggle('flip');if(!c.classList.contains('flip'))return;say(fc.list[fc.i][0])}
  else if(a==='fnext'){fc.i=(fc.i+1)%fc.list.length;drawCard()}
  else if(a==='fprev'){fc.i=(fc.i-1+fc.list.length)%fc.list.length;drawCard()}
  else if(a==='game')startGame(d.g);
  else if(a==='ans')answer(b,+d.k);
  else if(a==='tile')tile(b,+d.k);
  else if(a==='gans')gans(b,+d.q,+d.k);
  else if(a==='cstart')drawC();
  else if(a==='cans')cans(b,+d.k);
  else if(a==='reset'){if(!resetArm){resetArm=true;b.textContent='Tap again to reset';setTimeout(()=>{resetArm=false;b.textContent='Reset stars'},3000)}
    else{stars=0;done={};save();resetArm=false;b.textContent='Reset stars';render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='certName'){sname=e.target.value.slice(0,40);save();document.getElementById('certOut').innerHTML=esc(sname)||'&nbsp;'}});
render();
</script>

</body></html>
